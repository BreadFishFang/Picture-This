<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Add the container that will hold the entire content -->
  <div class="container">
    
    <header class="header">
      <div class="title">
        <h1>Picture This!</h1>
        <h4>My Really Cool Blog Post</h4>
      </div>
      <!--Add a section that will hold the image, 
      and I can change the size in css with different viewports-->
      <section class="main-image-forsize">
      </section>
      <!-- I don't want to use srcset in html, 
       so just leave the sample here and comment it here. 
       whenever I want to test it, I can just uncomment it and use it.
      <img src="images/museum.jpg" 
           alt="placeholder"
           srcset="images/museum-320x.jpg 1x
                   images/museum-640x.jpg 2x
                   images/museum-960x.jpg 3x"
           >
      -->
    </header>
  </div>
</body>

</html>
